name: Verify Telegram 12.10.5

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct HTTPS URL to the exact Telegram 12.10.5 APK (must serve the APK bytes)"
        required: true
        type: string
      apk_sha256:
        description: "Expected SHA-256 of Telegram 12.10.5 APK"
        required: false
        default: "fd741e054251ab7499a1b4ac55df6be8880aa054fba5c62a196557ab4050db5b"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build MPP
        run: ./gradlew :patches:buildAndroid --no-daemon -Pgpr.user="${GITHUB_ACTOR}" -Pgpr.key="${GITHUB_TOKEN}"

      - name: Download exact APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          EXPECTED_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o telegram-12.10.5.apk "$APK_URL"
          actual="$(sha256sum telegram-12.10.5.apk | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          echo "APK SHA-256 verified: $actual"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate package/version
        run: |
          sdkmanager "build-tools;35.0.0" >/dev/null
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$aapt2" dump badging telegram-12.10.5.apk | tee apk-badging.txt
          grep -q "package: name='org.telegram.messenger'" apk-badging.txt
          grep -q "versionName='12.10.5'" apk-badging.txt
          grep -q "versionCode='71052'" apk-badging.txt

      - name: Download Morphe Desktop
        run: |
          mkdir -p tools
          asset="$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n1)"
          test -n "$asset" && test "$asset" != "null"
          curl -fL "$asset" -o tools/morphe-desktop.jar
          java -jar tools/morphe-desktop.jar --version

      - name: Apply each patch independently
        run: |
          set -euo pipefail
          mpp="$(find patches/build/libs -name 'patches-*.mpp' -print -quit)"
          mkdir -p verify-results verify-tmp
          patches=(
            "Remove ads"
            "Unlock Premium"
            "Hide typing indicator"
            "Anti-delete messages"
            "Voice to music"
            "Download speed boost"
            "Disable auto-update"
            "Bypass integrity check"
            "Use normal paste"
            "Anti-disappearing media"
            "Disable channel switching"
            "Bypass channel restrictions"
            "Bypass content restrictions"
            "Anti-screenshot notification"
            "Enable translations"
            "High quality stories"
            "Stories features"
          )
          for patch in "${patches[@]}"; do
            slug="$(printf '%s' "$patch" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-')"
            java -Xmx5g -jar tools/morphe-desktop.jar patch               --patches "$mpp" --exclusive --enable "$patch"               --bytecode-mode FULL --verify-with-sdk "$ANDROID_HOME" --unsigned               --result-file "verify-results/$slug.json"               --temporary-files-path "verify-tmp/$slug"               --out "verify-results/$slug.apk"               telegram-12.10.5.apk
            jq -e '.success == true' "verify-results/$slug.json"
          done

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-12.10.5-verification
          path: |
            apk-badging.txt
            verify-results/*.json
